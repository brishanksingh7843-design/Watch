<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="black" />
    <title>Accept</title>
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/brishanksingh7843-design/Logo/999ef212cba1572635b881694b1a7e765aeaf843/search.png"
    />
    <style>
      body {
        background: conic-gradient(
          from var(--angle) at 50% 50%,
          red,
          rgb(0, 0, 0)
        );
        color: white;
        width: 100vw;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        align-content: center;
        row-gap: 60px;
        height: 100vh;
        animation: 7s rotate linear 0.2s infinite;
        overflow-x: hidden;
        overflow-y: auto;
      }
      /* @property --angle {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      } */
      @keyframes rotate {
        from {
          --angle: 0deg;
        }
        to {
          --angle: 360deg;
        }
      }
      h1 {
        text-align: center;
        font-size: 35px;
        font-weight: bold;
        font-style: italic;
        letter-spacing: 1px;
        font-family: Helvetica;
      }
      button {
        width: 100px;
        margin-top: 15px;
        height: 30px;
        font-size: 15px;
        font-weight: bold;
        background: linear-gradient(to right, black, grey);
        border: 2px solid cyan;
        border-radius: 10px;
        color: white;
        transition: transform 0.3s;
      }
      button:active {
        transform: scale(0.8);
      }
      button:hover {
        border-color: rgb(157, 0, 175);
      }
      .container {
        display: grid;
        grid-template-columns: 1fr;
        grid-auto-rows: auto;
        row-gap: 20px;
        margin: 0;
        padding: 20px;
        width: 80vw;
        box-sizing: border-box;
      }
      .contain {
        border: 2px solid coral;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div><h1>Requests</h1></div>
    <div class="container">
      <div class="contain">
        <div>Name:Bissu</div>
        <div>Username: @@</div>
        <div>Description:</div>
        <button
          class="button"
          data-name="bri"
          data-username="@234"
          data-description="asdffdsa"
        >
          Accept
        </button>
      </div>
      <div class="contain">
        <div>Name:B</div>
        <div>Username: @@</div>
        <div>Description:</div>
        <button
          class="button"
          data-name="bri"
          data-username="@234"
          data-description="asdffdsa"
        >
          Accept
        </button>
      </div>
      <div class="contain">
        <div>Name:Bis</div>
        <div>Username: @@</div>
        <div>Description:</div>
        <button
          class="button"
          data-name="bri"
          data-username="@234"
          data-description="asdffdsa"
        >
          Accept
        </button>
      </div>
    </div>
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
      import {
        getDatabase,
        set,
        get,
        ref,
        update,
        remove,
        onValue,
      } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
      // TODO: Add SDKs for Firebase products that you want to use
      // https://firebase.google.com/docs/web/setup#available-libraries

      // Your web app's Firebase configuration
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const firebaseConfig = {
        apiKey: "AIzaSyB8rjh6NKrg4Yx3hRLvY9IoUFlKIpbl9vQ",
        authDomain: "myhomepage-a903f.firebaseapp.com",
        databaseURL:
          "https://myhomepage-a903f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "myhomepage-a903f",
        storageBucket: "myhomepage-a903f.firebasestorage.app",
        messagingSenderId: "147182994829",
        appId: "1:147182994829:web:ed1ab09feb736c7683a9c4",
        measurementId: "G-5KDSSM53B9",
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const db = getDatabase(
        app,
        "https://myhomepage-a903f-default-rtdb.asia-southeast1.firebasedatabase.app/",
      );
      let container = document.querySelector(".container");
      let button = document.querySelectorAll(".button");
      function calledforsomething() {
        button.forEach((e) => {
          e.addEventListener("click", async (e) => {
            console.log(e.target);
            let name = e.currentTarget.dataset.name;
            let username = e.currentTarget.dataset.username;
            let description = e.currentTarget.dataset.description;
            senditit(name, username, description);
            // console.log(name);
            // console.log(description);
            // console.log(username);
          });
        });
      }
      async function senditit(n, u, d) {
        let path = ref(db, "MovieApp/Requests");
        let data = await get(path);
        console.log(data.val());
        let link = "";
        data.forEach((child) => {
          link += `
          <div class="contain">
        <div>Name: ${child.val().name}</div>
        <div>Username: ${child.val().username}</div>
        <div>Description: ${child.val().description}</div>
        <button
          class="button"
          data-name="${child.val().name}"
          data-username="${child.val().username}"
          data-description="${child.val().description}"
        >
          Accept
        </button>
      </div>`;
          // console.log(child.val().name);
          // console.log(child.key);
          if (child.val().name == n) {
            let pa = ref(db, `MovieApp/Accepted/${child.key}`);
            set(pa, { name: n, username: u, description: d });
            let pat = ref(db, `MovieApp/Requests/${child.key}`);
            remove(pat);
          }
        });
        container.innerHTML = link;
        button = document.querySelectorAll(".button");
        calledforsomething();
      }
      senditit();
    </script>
  </body>
</html>
